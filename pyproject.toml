[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crytocrawl"
version = "0.2.1"
description = "Local, queryable store of every Bitcoin address that ever held a balance, with current balances."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.scripts]
crytocrawl = "crytocrawl.cli:main"
seedderive = "crytocrawl.derive:main"
seedcheck = "crytocrawl.seedcheck:main"

[tool.setuptools]
packages = ["crytocrawl"]
